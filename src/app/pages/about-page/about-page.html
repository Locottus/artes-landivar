<cvp-section-layout>
  <div class="about stack">
    <p class="about__lead">
      El {{ site.name }} es la plataforma de la {{ site.institution }} para investigar, conservar
      y difundir el patrimonio artístico y cultural.
    </p>

    <div class="grid grid--cols-2">
      <section class="card about__block">
        <div class="card__body">
          <h2 class="card__title">Misión</h2>
          <p class="text-muted">Texto de la misión del Centro Virtual del Patrimonio.</p>
        </div>
      </section>
      <section class="card about__block">
        <div class="card__body">
          <h2 class="card__title">Visión</h2>
          <p class="text-muted">Texto de la visión del Centro Virtual del Patrimonio.</p>
        </div>
      </section>
    </div>

    <div class="about__actions">
      <a routerLink="/contacto" class="btn btn--primary">Contáctanos</a>
      <a routerLink="/redes-sociales" class="btn btn--outline">Síguenos</a>
    </div>
  </div>
</cvp-section-layout>
