<cvp-section-layout>
  <cvp-tour-viewer [title]="page()?.label ?? 'Recorrido virtual'" [panoramaUrl]="page()?.image" />

  <section class="tour-page__info" aria-labelledby="tour-info-title">
    <h2 id="tour-info-title">Sobre este espacio</h2>
    <p class="text-muted">
      Ficha descriptiva del espacio: historia, ubicación, características arquitectónicas y
      elementos destacados del recorrido.
    </p>
  </section>
</cvp-section-layout>
