<cvp-section-layout>
  <ul class="grid grid--cols-3 social">
    @for (link of social; track link.label) {
      <li>
        <a class="card social__card" [href]="link.url" target="_blank" rel="noopener noreferrer">
          <span class="social__icon" aria-hidden="true">{{ link.label.charAt(0) }}</span>
          <span class="social__label">{{ link.label }}</span>
          <span class="sr-only">(se abre en una nueva pestaña)</span>
        </a>
      </li>
    }
  </ul>
</cvp-section-layout>
