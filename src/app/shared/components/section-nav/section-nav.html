<nav class="section-nav" [attr.aria-label]="'Secciones de ' + section().label">
  <button type="button" class="btn btn--outline section-nav__toggle"
          aria-controls="section-nav-tree"
          [attr.aria-expanded]="expanded()"
          (click)="toggle()">
    Explorar {{ section().menuLabel ?? section().label }}
  </button>

  <div id="section-nav-tree" class="section-nav__tree" [class.is-open]="expanded()">
    <a class="section-nav__title" [routerLink]="section().path" routerLinkActive="is-active"
       [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
      {{ section().label }}
    </a>
    <ng-container [ngTemplateOutlet]="tree" [ngTemplateOutletContext]="{ $implicit: section().children }" />
  </div>
</nav>

<ng-template #tree let-items>
  <ul class="section-nav__list">
    @for (item of items; track item.path) {
      <li>
        <a class="section-nav__link" [routerLink]="item.path" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">{{ item.label }}</a>
        @if (item.children.length) {
          <ng-container [ngTemplateOutlet]="tree" [ngTemplateOutletContext]="{ $implicit: item.children }" />
        }
      </li>
    }
  </ul>
</ng-template>
