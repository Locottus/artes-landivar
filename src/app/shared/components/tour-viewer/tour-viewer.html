<figure class="tour-viewer">
  <div class="tour-viewer__stage" role="img" [attr.aria-label]="'Recorrido virtual 360° de ' + title()">
    <span class="tour-viewer__badge" aria-hidden="true">360°</span>
    <p class="tour-viewer__message">El visor del recorrido virtual se mostrará aquí.</p>
  </div>
  <figcaption class="tour-viewer__caption">{{ title() }}</figcaption>
</figure>
